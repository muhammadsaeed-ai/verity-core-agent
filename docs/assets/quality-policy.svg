<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" fill="none" role="img" aria-labelledby="t d">
<title id="t">Verity-1 QA policy and CI facts</title><desc id="d">Configured QA confidence threshold is 0.80; retries are capped at two; latest verified CI run passed ten automated tests and generated five smoke-test artifact types.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="390" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1826"/><stop offset="1" stop-color="#151128"/></linearGradient><linearGradient id="bar"><stop stop-color="#3CAFD3"/><stop offset="1" stop-color="#6EEBC1"/></linearGradient></defs><rect width="1200" height="390" rx="24" fill="url(#bg)" stroke="#263B55"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="38" y="43" fill="#71EAFE" font-size="11" font-weight="800" letter-spacing="2">VERIFICATION POLICY / SIGNALS</text><text x="38" y="80" fill="#F0F6FF" font-size="27" font-weight="800">What the system can verify.</text><text x="40" y="106" fill="#93A9BE" font-size="13">Implementation controls and a successful deterministic CI run—not model-quality benchmarks.</text>
<g transform="translate(40 137)"><rect width="582" height="215" rx="15" fill="#0A1421" stroke="#263B55"/><text x="22" y="29" fill="#9DB5CA" font-size="11" font-weight="800" letter-spacing="1.4">QA CONFIDENCE GATE</text><text x="22" y="66" fill="#ECF6FF" font-size="31" font-weight="800">0.80 <tspan fill="#6CECC2" font-size="13" font-weight="650">pass threshold</tspan></text><rect x="22" y="86" width="536" height="15" rx="7.5" fill="#25374A"/><rect x="22" y="86" width="428.8" height="15" rx="7.5" fill="url(#bar)"/><path d="M450.8 79V108" stroke="#F4D17A" stroke-width="2"/><circle cx="450.8" cy="93.5" r="5.5" fill="#F4D17A"/><g fill="#7893AB" font-size="9"><text x="22" y="121">0.00</text><text x="129" y="121" text-anchor="middle">0.20</text><text x="236" y="121" text-anchor="middle">0.40</text><text x="344" y="121" text-anchor="middle">0.60</text><text x="451" y="121" text-anchor="middle">0.80</text><text x="558" y="121" text-anchor="end">1.00</text></g><rect x="22" y="145" width="248" height="43" rx="9" fill="#30263E" stroke="#755C91"/><text x="36" y="171" fill="#EAD8FF" font-size="11" font-weight="700">Below threshold → retry / review</text><rect x="282" y="145" width="276" height="43" rx="9" fill="#12342F" stroke="#367B68"/><text x="296" y="171" fill="#C8FFEA" font-size="11" font-weight="700">At / above threshold → accepted</text></g>
<g transform="translate(645 137)"><rect width="238" height="98" rx="14" fill="#0A1421" stroke="#263B55"/><text x="17" y="27" fill="#8DA6BD" font-size="10" font-weight="800" letter-spacing="1.1">MAX RETRIES</text><text x="17" y="71" fill="#F0F6FF" font-size="37" font-weight="800">02</text><rect x="116" y="49" width="31" height="18" rx="4" fill="#3D3567" stroke="#9F90F9"/><rect x="153" y="49" width="31" height="18" rx="4" fill="#3D3567" stroke="#9F90F9"/></g>
