<g><rect x="101" y="546" width="160" height="66" rx="10" fill="#1B253B" stroke="#5968A9"/><text x="181" y="572" text-anchor="middle" fill="#EDEBFF" font-size="12" font-weight="750">Lead Architect</text><text x="181" y="591" text-anchor="middle" fill="#B0B6D8" font-size="10">Plan + risks</text><rect x="282" y="546" width="160" height="66" rx="10" fill="#1B253B" stroke="#5968A9"/><text x="362" y="572" text-anchor="middle" fill="#EDEBFF" font-size="12" font-weight="750">Web Operator</text><text x="362" y="591" text-anchor="middle" fill="#B0B6D8" font-size="10">Evidence gathering</text><rect x="463" y="546" width="160" height="66" rx="10" fill="#1B253B" stroke="#5968A9"/><text x="543" y="572" text-anchor="middle" fill="#EDEBFF" font-size="12" font-weight="750">QA Critic</text><text x="543" y="591" text-anchor="middle" fill="#B0B6D8" font-size="10">Find gaps</text></g><text x="101" y="651" fill="#94A9BE" font-size="12">Sequential specialist tasks • Gemini or local Ollama</text><text x="101" y="676" fill="#65839D" font-size="10">Browser Use is isolated in an optional Python environment.</text>
<rect x="679" y="492" width="577" height="222" rx="17" fill="#101B2B" stroke="#2D4562"/><text x="704" y="524" fill="#7F9CB6" font-size="10" font-weight="800" letter-spacing="1.6">QUALITY GATE / CONDITIONAL ROUTING</text><rect x="704" y="546" width="157" height="65" rx="10" fill="#1B253B" stroke="#6C61B8"/><text x="782" y="571" text-anchor="middle" fill="#F0ECFF" font-size="12" font-weight="750">QA confidence</text><text x="782" y="590" text-anchor="middle" fill="#BDB2EA" font-size="10">Threshold: 0.80</text><path d="M861 578H889" stroke="#4F7594" stroke-width="2"/><path d="M882 572l7 6-7 6" stroke="#4F7594" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="889" y="546" width="153" height="65" rx="10" fill="#12322D" stroke="#45AB8C"/><text x="965" y="571" text-anchor="middle" fill="#E2FFF3" font-size="12" font-weight="750">Pass → report</text><text x="965" y="590" text-anchor="middle" fill="#99D9C2" font-size="10">Completed</text><rect x="1060" y="546" width="166" height="65" rx="10" fill="#30243B" stroke="#9B78D0"/><text x="1143" y="571" text-anchor="middle" fill="#F4E9FF" font-size="12" font-weight="750">Fail → retry</text><text x="1143" y="590" text-anchor="middle" fill="#C8ACEA" font-size="10">Maximum 2 retries</text><text x="704" y="651" fill="#94A9BE" font-size="12">Exhaustion finishes as needs_review, not false success.</text><text x="704" y="676" fill="#65839D" font-size="10">Automated confidence is a routing signal, not proof of factual correctness.</text>
