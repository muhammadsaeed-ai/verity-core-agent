<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" fill="none" role="img" aria-labelledby="t d">
<title id="t">Verity-1 system architecture infographic</title><desc id="d">LangGraph owns state and routing. CrewAI runs specialists. Pydantic validates evidence and reports. QA controls retries. FastAPI and n8n integrate with SQLite-persisted state.</desc>
