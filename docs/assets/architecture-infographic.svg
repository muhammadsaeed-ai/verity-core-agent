<rect width="1500" height="900" rx="28" fill="url(#bg)"/><rect width="1500" height="900" rx="28" fill="url(#dots)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="64" y="64" fill="#6DEAFB" font-size="12" font-weight="800" letter-spacing="3">VERITYAGENT / SYSTEM BLUEPRINT</text><text x="64" y="115" fill="#F0F6FF" font-size="39" font-weight="850">One objective. A traceable execution graph.</text><text x="66" y="150" fill="#9BB1C7" font-size="16">Stateful orchestration on the outside. Specialists and validated artifacts inside.</text>
